# Exact-lower-bound dependency smoke for the x402 SDK.
# Manual only. Installs the built wheel with x402 pinned to the exact floor
# declared in pyproject.toml, imports carrydesk.api, and reads the generated
# OpenAPI document, so any future SDK drift (a moved or removed module, a
# changed default asset table) fails here before a release does.
# Credential-free. No secrets, wallet, payment, SARIF upload, or mutation.

name: x402-floor-smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  floor-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Build wheel and sdist
        run: |
          python3 -m pip install --upgrade pip build
          python3 -m build

      - name: Install wheel at the exact declared x402 lower bound
        run: |
          python3 -m venv .venv-floor
          .venv-floor/bin/pip install --upgrade pip
          .venv-floor/bin/pip install dist/carrydesk-*.whl "x402[fastapi,evm,mcp,clients]==2.20.0"

      - name: Import the app and read OpenAPI at that bound
        run: |
          .venv-floor/bin/python - <<'PY'
          import importlib.metadata as im
          import json
          import pathlib
          import re
          import sys

          assert sys.version_info[:2] == (3, 12), sys.version

          floor = re.search(
              r'"x402\[[^]]*\]>=([0-9.]+)"',
              pathlib.Path("pyproject.toml").read_text(),
          ).group(1)
          assert floor == "2.20.0", floor
          assert im.version("x402") == floor, im.version("x402")

          import carrydesk.api as api

          assert api.app.title == "carrydesk"
          spec = api.app.openapi()
          json.dumps(spec)

          for path in ("/v1/carry/rankings", "/v1/carry/history/{coin}", "/v1/universe"):
              op = spec["paths"][path]["get"]
              info = op["x-payment-info"]
              assert info["price"]["currency"] == "USDC", path
              x402 = info["protocols"][0]["x402"]
              assert x402["network"] == "eip155:84532", path
              # Base Sepolia USDC, the x402 SDK's default charged asset.
              assert x402["asset"] == "0x036CbD53842c5426634e7929541eC2318f3dCF7e", path

          for path in ("/v1/free/carry", "/v1/method", "/health"):
              op = spec["paths"][path]["get"]
              assert "x-payment-info" not in op, path
              assert "402" not in op["responses"], path

          print("floor-smoke ok: openapi", spec["openapi"])
          PY
