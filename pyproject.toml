[project]
name = "carrydesk"
version = "0.1.0"
description = "Cross-sectional funding-carry rankings for Hyperliquid perpetuals, sold per call in USDC."
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "httpx>=0.28.1",
    "x402[fastapi,evm,mcp,clients]>=2.17.0",
    "mcp>=1.0.0",
    "cdp-sdk>=1.47.0",   # only needed for Base mainnet (CDP facilitator auth)
]

[project.scripts]
# Lets the MCP server be installed and run in one command with no clone:
#   uvx --from git+https://github.com/pelazas/carrydesk carrydesk-mcp
# Every comparable entry on the MCP lists is a one-liner; a three-step clone
# is the single biggest friction point for anyone trying this.
carrydesk-mcp = "carrydesk.mcp_server:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["carrydesk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
